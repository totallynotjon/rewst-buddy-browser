<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rewst Buddy</title>
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 15px 0;
      color: #333;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #0052a3;
    }

    button:active {
      background-color: #003d7a;
    }

    .info {
      font-size: 12px;
      color: #666;
      margin-top: 10px;
      line-height: 1.4;
    }

    .error {
      font-size: 12px;
      color: #cc0000;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>Rewst Buddy</h1>
  <button id="sendToVSCode">Open in VS Code</button>
  <div id="error" class="error"></div>
  <div class="info">
    Opens the current template or script in VS Code.
  </div>
  <script src="./index.js"></script>
</body>
</html>
